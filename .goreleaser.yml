# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

archives:
  - id: archive
    name_template: '{{ .Binary }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}'
before:
  hooks:
    - make tfgen
builds:
  - binary: pulumi-resource-clickhouse
    dir: provider
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - windows
      - linux
    ldflags:
      # The line below MUST align with the module in current provider/go.mod
      - -X github.com/pulumiverse/pulumi-clickhouse/provider/pkg/version.Version={{.Tag }}
    main: ./cmd/pulumi-resource-clickhouse/
changelog:
  disable: true
release:
  disable: false
  prerelease: auto
  # Allow re-running release on the same tag without 422 already_exists on assets.
  replace_existing_artifacts: true